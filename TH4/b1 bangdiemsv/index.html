<title>Bảng điểm</title>
</head>

<body>

<table border="1" width="600">

<thead>
<tr>
<th>STT</th>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<p id="stats"></p>

<script src="script.js"></script>
