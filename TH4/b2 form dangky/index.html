<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Form đăng ký</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:5px;
border:1px solid #ccc;
border-radius:4px;
}

.error{
color:red;
font-size:13px;
margin-bottom:10px;
display:block;
}

.errorBorder{
border:2px solid red;
}

.successBorder{
border:2px solid green;
}

button{
width:100%;
padding:10px;
background:#4CAF50;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#45a049;
}

.radio-group{
margin-bottom:10px;
}

.successMsg{
text-align:center;
color:green;
font-size:20px;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Đăng ký tài khoản</h2>

<form id="registerForm">

<!-- HỌ TÊN -->

<label>Họ và tên</label>
<input id="fullname" maxlength="50">

<!-- đếm ký tự -->
<div id="nameCounter">0/50</div>

<span class="error" id="nameError"></span>


<!-- EMAIL -->

<label>Email</label>
<input id="email">
<span class="error" id="emailError"></span>


<!-- SĐT -->

<label>Số điện thoại</label>
<input id="phone">
<span class="error" id="phoneError"></span>


<!-- PASSWORD -->

<label>Mật khẩu</label>

<div class="password-box">

<input type="password" id="password">

<!-- nút hiện/ẩn mật khẩu -->
<span id="togglePass">👁</span>

</div>

<!-- thanh độ mạnh mật khẩu -->

<div style="height:6px;background:#ddd;margin-top:5px;">
<div id="strengthFill" style="height:6px;width:0%;"></div>
</div>

<div id="strengthText"></div>

<span class="error" id="passwordError"></span>


<!-- CONFIRM PASSWORD -->

<label>Xác nhận mật khẩu</label>

<input type="password" id="confirmPassword">

<span class="error" id="confirmPasswordError"></span>


<!-- GIỚI TÍNH -->

<div class="radio-group">

<label>Giới tính</label><br>

<input type="radio" name="gender" value="male"> Nam
<input type="radio" name="gender" value="female"> Nữ

<span class="error" id="genderError"></span>

</div>


<!-- TERMS -->

<label>

<input type="checkbox" id="terms">
Tôi đồng ý với điều khoản

</label>

<span class="error" id="termsError"></span>


<button type="submit">Đăng ký</button>

</form>

<h3 id="successMsg" class="successMsg"></h3>

</div>

<script src="script.js"></script>

</body>
</html>
